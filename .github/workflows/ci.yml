name: ci

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set ENV
      run: |
        sudo timedatectl set-timezone "Asia/Shanghai"
        [ ! -f module/bin ] && mkdir module/bin
        text="${{ github.event.head_commit.message }}"
        build_sha="$(git rev-parse --short=7 HEAD)"
        build_date="$(date +%Y%m%d)"
        echo "buildSha=${build_sha}" >> $GITHUB_ENV
        echo "buildDate=${build_date}" >> $GITHUB_ENV
        echo "zipName=akashaProxy-${build_date}-${build_sha}.zip" >> $GITHUB_ENV
        echo "ciTag=${build_date}-${build_sha}" >> $GITHUB_ENV
        echo "commit=$(echo $text | sed 's/\([][\`.*^$\/+?{}()=!|:-]\)/\\1/g')" >> $GITHUB_ENV

    - name: Update Submodules
      run: |
        git submodule init
        git submodule update --init --recursive --force

    - uses: pnpm/action-setup@v4
      name: Setup pnpm
      with:
        version: 10
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.2'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Install zip
      uses: montudor/action-zip@v1

    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: Pack Module
      run: |
        make CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang

    - name: Rename ZIP
      run: |
        mv -f akashaProxy.zip "${{ env.zipName }}"
        ls -lh "${{ env.zipName }}"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.zipName }}
        path: ${{ env.zipName }}

    - name: Post to Telegram Channel
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      env:
        CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        FILE: ${{ env.zipName }}
        COMMIT_MESSAGE: |+
          **New push to github\!**

          `${{ env.commit }}`
              
          by ${{ github.event.head_commit.author.name }}
          For more architecture see [action](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          See commit detail [here](${{ github.event.head_commit.url }})
      run: |
        ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')
        curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22:%22document%22,%20%22media%22:%22attach://release%22,%22parse_mode%22:%22MarkdownV2%22,%22caption%22:${ESCAPED}%7D%5D" -F release="@${FILE}"

    # 一次性清理: 只在 commit message 里带 [purge releases] 时执行。
    # 删除本仓库的全部 release 及其对应 tag (--cleanup-tag), 不会碰没有 release 的 tag。
    - name: Purge existing releases
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[purge releases]')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -u
        tags="$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName')"
        if [ -z "${tags}" ]; then
          echo "no release to purge"
        else
          echo "${tags}" | while read -r t; do
            [ -z "${t}" ] && continue
            echo "deleting release ${t}"
            gh release delete "${t}" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
        fi
        echo "remaining releases:"
        gh release list --repo "${{ github.repository }}" --limit 200 || true

    - name: Create CI Tag
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git tag -f "${{ env.ciTag }}"
        git push -f origin "${{ env.ciTag }}"

    - name: Upload release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'  
      uses: softprops/action-gh-release@v1
      with:
          tag_name: ${{ env.ciTag }}
          name: akashaProxy ${{ env.ciTag }}
          body_path: CHANGELOG.md
          files: ${{ env.zipName }}
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
